<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Brain | Neumorphic UI</title>
    <!-- Modern typography matching the design reference -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/clay.css?v=3">
</head>
<body>
    
    <div class="app-container">
        <!-- Main Chat Card (Extruded Neumorphic shape) -->
        <main class="chat-card">
            
            <header class="chat-header">
                <h1>Brain AI</h1>
                <div id="status-indicator" class="status-indicator"></div>
            </header>

            <div id="chat-history" class="chat-history">
                <div class="msg-wrapper brain-msg-wrapper">
                    <div class="msg brain-msg">System initialized. Awaiting input.</div>
                </div>
            </div>

            <div class="input-area">
                <!-- Inset Neumorphic pill shape -->
                <div class="input-wrapper">
                    <input type="text" id="user-input" autocomplete="off" autofocus placeholder="Search or ask anything...">
                    <button id="send-btn" class="icon-btn">
                        <!-- Simple SVG send icon -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
            
        </main>
    </div>

    <script src="/static/app.js?v=5"></script>
</body>
</html>
